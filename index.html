<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Gateway Payment / Pasarela de Pago Segura</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f3; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .payment-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
        .payment-header { text-align: center; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 20px; }
        .payment-header h2 { margin: 0; color: #2c3e50; font-size: 1.6em; }
        .payment-header p { margin: 5px 0 0 0; color: #7f8c8d; font-size: 0.9em; }
        .product-summary { background-color: #ebf5fb; border-left: 5px solid #3498db; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        .product-summary p { margin: 5px 0; font-size: 0.95em; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; font-size: 0.9em; }
        input[type="text"], input[type="email"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em; }
        .input-row { display: flex; gap: 10px; }
        .btn-pay-now { background-color: #2ecc71; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-pay-now:hover { background-color: #27ae60; }
        .footer-secure { text-align: center; margin-top: 15px; color: #95a5a6; font-size: 0.8em; font-weight: bold; }
    </style>
</head>
<body>

    <div class="payment-card">
        <div class="payment-header">
            <h2>Secure Gateway Checkout</h2>
            <p>Pasarela de Pago Segura e Integrada</p>
        </div>

        <div class="product-summary">
            <p><strong>Item / Artículo:</strong> <span id="summaryItem">Cargando...</span></p>
            <p><strong>Total to Pay / Total a Pagar:</strong> <span id="summaryPrice" style="color: #27ae60; font-weight: bold;">$0</span></p>
        </div>

        <form onsubmit="processPayment(event)">
            <div class="form-group">
                <label>Cardholder Name / Nombre en la Tarjeta:</label>
                <input type="text" placeholder="Ej. Alejandro Ochoa" required>
            </div>
            <div class="form-group">
                <label>Card Number / Número de Tarjeta:</label>
                <input type="text" placeholder="ffff ffff ffff ffff" maxlength="19" required>
            </div>
            <div class="input-row">
                <div class="form-group" style="flex: 1;">
                    <label>Expiration / Vence:</label>
                    <input type="text" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>CVV / Seg.:</label>
                    <input type="text" placeholder="123" maxlength="3" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email Address / Correo:</label>
                <input type="email" placeholder="ejemplo@correo.com" required>
            </div>
            <button type="submit" class="btn-pay-now">Confirm Secure Payment</button>
        </form>

        <div class="footer-secure">
            🔒 SSL Secured Connection / Conexión Encriptada
        </div>
    </div>

    <script>
        // Captura los parámetros dinámicos enviados por la URL desde la tabla del inventario
        const urlParams = new URLSearchParams(window.location.search);
        const itemName = urlParams.get('item') || 'Producto General';
        const itemPrice = urlParams.get('price') || '0';

        document.getElementById('summaryItem').innerText = itemName;
        document.getElementById('summaryPrice').innerText = '$' + Number(itemPrice).toLocaleString();

        function processPayment(e) {
            e.preventDefault();
            alert(`¡Pago Exitoso! Se ha procesado la compra de ${itemName} por un valor de $${Number(itemPrice).toLocaleString()}.\nSu recibo fue enviado al correo.`);
            window.close(); // Cierra la pestaña automáticamente al finalizar
        }
    </script>
</body>
</html>
