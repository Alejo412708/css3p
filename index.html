<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad Integradora CSS3</title>

    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .seccion {
            background-color: white;
            border: 3px solid #2c3e50;
            margin: 30px auto;
            padding: 20px;
            width: 70%;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
            text-align: center;
        }

        .seccion h1 {
            color: darkblue;
        }

        .seccion p {
            font-size: 18px;
            color: #333333;
            margin: 15px;
            padding: 10px;
            border: 1px solid #cccccc;
        }

        .seccion img {
            width: 250px;
            margin-top: 15px;
            padding: 10px;
            border: 2px solid black;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <section class="seccion">
        <h1>Mi Actividad Integradora</h1>

        <p>
            Esta es una sección diseñada con CSS3 aplicando colores,
            bordes, márgenes y relleno utilizando el modelo de caja.
        </p>

        <img src="https://via.placeholder.com/250" alt="Imagen de ejemplo">
    </section>

</body>
</html>
